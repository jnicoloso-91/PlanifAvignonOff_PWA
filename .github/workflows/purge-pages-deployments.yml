name: Purge Pages deployments

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: List & cancel stuck github-pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const envName = "github-pages";
            const deployments = await github.request(
              "GET /repos/{owner}/{repo}/deployments",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: envName,
                per_page: 100
              }
            );

            if (!deployments.data.length) {
              core.info("Aucun deployment trouvé pour l'environnement github-pages.");
              return;
            }

            let canceled = 0;
            for (const d of deployments.data) {
              await github.request(
                "POST /repos/{owner}/{repo}/deployments/{deployment_id}/statuses",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: d.id,
                  state: "inactive",
                  description: "bulk cancel via purge workflow"
                }
              );
              canceled++;
              core.info(Marked deployment ${d.id} (sha ${d.sha}) as inactive);
            }

            core.notice(Purged ${canceled} deployment(s) for environment ${envName}.);
